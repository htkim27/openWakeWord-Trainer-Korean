[project]
name = "korean-openwakeword-trainer"
version = "0.1.0"
description = "Korean wake-word dataset generation and openWakeWord training with OmniVoice"
requires-python = ">=3.10,<3.13"
dependencies = [
  "acoustics==0.2.6",
  "audiomentations==0.33.0",
  "datasets==2.20.0",
  "deep-phonemizer==0.0.19",
  "librosa==0.10.2.post1",
  "mutagen==1.47.0",
  "numpy==2.0.2",
  "onnx==1.19.1",
  "onnxruntime==1.22.1",
  "omnivoice==0.2.1",
  "openwakeword==0.6.0",
  "piper-phonemize-cross==1.2.1",
  "piper-tts==1.3.0",
  "pronouncing==0.2.0",
  "pyyaml==6.0.2",
  "requests==2.32.5",
  "scipy==1.13.1",
  "setuptools==80.9.0",
  "speechbrain==1.0.3",
  "soundfile==0.13.1",
  "torch==2.6.0",
  "torch-audiomentations==0.12.0",
  "torchaudio==2.6.0",
  "torchinfo==1.8.0",
  "torchmetrics==1.8.2",
  "tqdm==4.67.3",
  "webrtcvad==2.0.10",
]

[tool.ruff]
line-length = 100
